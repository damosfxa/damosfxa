# Membuat animasi ular yang memakan kotak kontribusi, diperbarui otomatis setiap hari.
name: Animasi ular kontribusi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F2A33A&color_dots=#F3E3C3,#E8C46A,#F2A33A,#B86A12,#3B2A20
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F2A33A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
